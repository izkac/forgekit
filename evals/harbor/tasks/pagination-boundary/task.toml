schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit/pagination-boundary"
version = "1.0.0"
description = "Fix an exact-page pagination boundary bug and add a regression test."
authors = []
keywords = ["node", "http", "pagination", "bug"]

[metadata]
difficulty = "easy"
category = "programming"
benchmark_category = "bug"
tags = ["node", "http", "pagination", "bug"]
difficulty_explanation = "A focused boundary defect with an HTTP regression test and a separate hidden verifier."

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
