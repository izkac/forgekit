schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit/router-extraction"
version = "1.0.0"
description = "Extract an HTTP router and add parameterized item routing."
authors = []
keywords = ["node", "http", "refactor", "router"]

[metadata]
difficulty = "medium"
category = "programming"
benchmark_category = "refactor"
tags = ["node", "http", "routing", "module-extraction"]
difficulty_explanation = "Requires a structural module extraction while preserving routes and adding parameter matching."

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
