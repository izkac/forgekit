schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit-hard-v2/carrier-event-reconciliation"
version = "1.0.0"
description = "Repair carrier webhook reconciliation for scoped idempotency and provider event ordering."
authors = []
keywords = ["node", "carriers", "shipments", "webhooks", "reconciliation", "idempotency"]

[metadata]
difficulty = "hard"
category = "integration"
benchmark_category = "integration"
tags = ["node", "carriers", "shipments", "webhook", "reconciliation", "idempotency", "integration"]
difficulty_explanation = "Requires tracing carrier-specific normalization, append-only event persistence, shipment projection, scoped deduplication, and provider sequence precedence through a real HTTP composition path."

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
semantic_mutants = ["tests/mutants/reconciliation-service.mjs"]
[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
