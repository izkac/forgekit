schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit-hard-v2/tenant-signed-downloads"
version = "1.0.0"
description = "Bind signed document-download capabilities to the complete tenant context."
authors = []
keywords = ["node", "http", "security", "hmac", "multi-tenant"]

[metadata]
difficulty = "hard"
category = "programming"
benchmark_category = "security"
tags = ["node", "http", "capability", "hmac", "tenant-isolation"]
difficulty_explanation = "Requires tracing authenticated, routed, signed, and stored tenant context across a multi-module HTTP service while preserving exact download behavior and failing closed on adversarial capability input."

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
semantic_mutants = ["tests/mutants/capability-service.mjs"]

[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
