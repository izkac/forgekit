schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit-hard-v2/partial-refund-ledger-invariants"
version = "1.0.0"
description = "Repair cumulative partial-refund accounting while preserving payment and idempotency invariants."
authors = []
keywords = ["node", "payments", "refunds", "ledger", "idempotency"]

[metadata]
difficulty = "hard"
category = "programming"
benchmark_category = "tests"
tags = ["node", "payments", "refund", "ledger", "idempotency", "http"]
difficulty_explanation = "Requires tracing refund admission, gateway effects, append-only ledger state, and idempotent replay while detecting cumulative balance errors across sequential partial refunds."

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 180.0
environment_mode = "separate"

semantic_mutants = ["tests/mutants/refund-service.mjs"]
[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
