schema_version = "1.4"

# Only the application files required by the separate verifier cross the
# agent/verifier boundary. The verifier image and hidden grader stay in tests/.
artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit/node-health-endpoint"
version = "1.0.0"
description = "Add a health endpoint to a dependency-free Node HTTP fixture."
authors = []
keywords = ["node", "http", "smoke"]

[metadata]
difficulty = "easy"
category = "programming"
benchmark_category = "feature"
tags = ["node", "http", "health-check"]
difficulty_explanation = "Small local HTTP change with a regression test and an external verifier."

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
# Agent setup and model APIs require egress; the separate verifier remains isolated.
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
