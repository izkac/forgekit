schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit/episode-06"
version = "1.0.0"
description = "Auto-expire stale orders after 30 days using the NOW_MS clock seam."
authors = []
keywords = ["campaign"]

[metadata]
difficulty = "hard"
category = "programming"
benchmark_category = "tests"
tags = ["node", "orders", "expiry", "http", "campaign"]

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 180.0
environment_mode = "separate"

[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
