schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit/csv-formula-regression"
version = "1.0.0"
description = "Add boundary tests for CSV formula cells and fix the vulnerability they expose."
authors = []
keywords = ["node", "http", "csv", "security", "tests"]

[metadata]
difficulty = "medium"
category = "programming"
benchmark_category = "tests"
tags = ["node", "http", "csv", "security", "tests"]
difficulty_explanation = "A small security regression requiring endpoint-level boundary tests and a separate hidden verifier."

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
