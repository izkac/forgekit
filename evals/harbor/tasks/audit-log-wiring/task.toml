schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
]

[task]
name = "forgekit/audit-log-wiring"
version = "1.0.0"
description = "Repair persistence and audit adapter wiring in a Node HTTP order path."
authors = []
keywords = ["node", "http", "integration", "audit"]

[metadata]
difficulty = "medium"
category = "programming"
benchmark_category = "integration"
tags = ["node", "http", "dependency-injection", "audit-log"]
difficulty_explanation = "Requires tracing an HTTP composition root and proving ordered effects across injected adapters."

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
