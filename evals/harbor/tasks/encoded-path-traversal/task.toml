schema_version = "1.4"

artifacts = [
  "/app/package.json",
  "/app/src/",
  "/app/public/",
  "/app/secret.txt",
]

[task]
name = "forgekit/encoded-path-traversal"
version = "1.0.0"
description = "Harden a dependency-free Node file server against encoded traversal."
authors = []
keywords = ["node", "http", "security", "path-traversal"]

[metadata]
difficulty = "medium"
category = "security"
tags = ["node", "http", "path-traversal", "regression-test"]
difficulty_explanation = "Requires canonicalizing adversarial URL paths without breaking legitimate encoded filenames."

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 10240

[environment]
os = "linux"
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
